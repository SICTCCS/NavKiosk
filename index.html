        //      This section is commented out as it is now deprecated 
        var mapInitialized = false;
        function nav(){
            var mapDiv = document.getElementById("map");
            if (!mapInitialized) {
                var newMapDiv = document.createElement('div');
                newMapDiv.id = 'map';
                newMapDiv.className = 'nav-active';
                mapDiv.parentNode.replaceChild(newMapDiv, mapDiv);
                var map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([38.01194, -87.53088], 18);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    minZoom: 17
                }).addTo(map);
